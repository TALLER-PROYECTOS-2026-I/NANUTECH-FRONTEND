version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Instalación limpia basada en el package-lock.json
        - npm ci
    build:
      commands:
        # Comando de compilación estándar de Vite
        - npm run build
  artifacts:
    # Apuntamos a la carpeta dist de la aplicación principal
    baseDirectory: apps/shell-app/dist
    files:
      - '**/*'
  cache:
    paths:
      # Cachear los módulos para que los siguientes despliegues sean más rápidos
      - node_modules/**/*
