openapi: 3.0.3
info:
  title: NANUTECH Frontend API
  description: |
    Documentación de los endpoints consumidos por el sistema de gestión de flota NANUTECH.
    Consumidos por los MFEs: **shell-app**, **mfe-flota**, **mfe-contratos** y **mfe-dashboard**.
  version: 1.0.0
  contact:
    name: Equipo NANUTECH
    email: soporte@nanutech.com

servers:
  - url: https://q26dwk17da.execute-api.us-east-1.amazonaws.com/Stage
    description: Backend AWS API Gateway (producción)
  - url: http://localhost:4010
    description: Mock server (Prism)

tags:
  - name: Auth
    description: Autenticación y gestión de sesión
  - name: Jornadas
    description: Gestión de jornadas de conductores (mfe-flota)
  - name: Auditoría
    description: Registro de accesos y auditoría (mfe-dashboard)
  - name: Flota
    description: Gestión de vehículos de la flota
  - name: Contratos
    description: Gestión de contratos de transporte

paths:
  /auth/login:
    post:
      summary: Iniciar sesión
      description: Autentica al usuario con email y contraseña. Retorna un token JWT.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@nanutech.com
                password:
                  type: string
                  format: password
                  example: "secret123"
      responses:
        '200':
          description: Login exitoso — retorna token JWT y datos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "usr-001"
                      nombre:
                        type: string
                        example: "Hugo Menes"
                      rol:
                        type: string
                        enum: [Administrador, Gerente, Conductor]
                        example: Administrador
        '401':
          description: Credenciales inválidas

  /jornadas:
    get:
      summary: Listar todas las jornadas
      description: Retorna el listado completo de jornadas registradas en el sistema. Consumido por **mfe-flota**.
      tags: [Jornadas]
      responses:
        '200':
          description: Lista de jornadas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "jornada-001"
                    conductorId:
                      type: string
                      example: "CONDUCTOR-001"
                    fechaInicio:
                      type: string
                      format: date-time
                      example: "2026-06-03T08:00:00Z"
                    fechaFin:
                      type: string
                      format: date-time
                      example: "2026-06-03T18:00:00Z"
                    estado:
                      type: string
                      enum: [ACTIVA, FINALIZADA, PENDIENTE]
                      example: ACTIVA
        '401':
          description: No autorizado

  /jornadas/actual/{conductorId}:
    get:
      summary: Obtener jornada actual del conductor
      description: Retorna la jornada activa actual para un conductor específico. Consumido por **mfe-flota**.
      tags: [Jornadas]
      parameters:
        - name: conductorId
          in: path
          required: true
          description: ID único del conductor
          schema:
            type: string
          example: "CONDUCTOR-001"
      responses:
        '200':
          description: Jornada actual del conductor
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "jornada-001"
                  conductorId:
                    type: string
                    example: "CONDUCTOR-001"
                  estado:
                    type: string
                    enum: [ACTIVA, FINALIZADA]
                    example: ACTIVA
                  fechaInicio:
                    type: string
                    format: date-time
                    example: "2026-06-03T08:00:00Z"
        '404':
          description: No hay jornada activa para este conductor
        '401':
          description: No autorizado

  /auditoria/accesos:
    get:
      summary: Obtener registros de auditoría de accesos
      description: Retorna el historial inmutable de inicios de sesión. Consumido por **mfe-dashboard**.
      tags: [Auditoría]
      responses:
        '200':
          description: Lista de registros de auditoría
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "audit-001"
                    usuario:
                      type: string
                      example: "Hugo Menes"
                    email:
                      type: string
                      example: "hugo@nanutech.com"
                    rol:
                      type: string
                      enum: [Administrador, Gerente, Conductor]
                      example: Administrador
                    fecha:
                      type: string
                      example: "03/06/2026"
                    hora:
                      type: string
                      example: "08:30:00"
                    ip:
                      type: string
                      example: "192.168.1.100"
                    navegador:
                      type: string
                      example: "Chrome 120 / Windows 10"
        '401':
          description: No autorizado

  /flota/camiones:
    get:
      summary: Listar camiones de la flota
      description: Retorna todos los vehículos registrados en el sistema de gestión de flota.
      tags: [Flota]
      responses:
        '200':
          description: Lista de camiones
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "cam-001"
                    placa:
                      type: string
                      example: "ABC-123"
                    marca:
                      type: string
                      example: "Volvo"
                    modelo:
                      type: string
                      example: "FH16"
                    estado:
                      type: string
                      enum: [ACTIVO, INACTIVO, MANTENIMIENTO]
                      example: ACTIVO
        '401':
          description: No autorizado

  /contratos:
    get:
      summary: Listar contratos
      description: Retorna todos los contratos de transporte registrados.
      tags: [Contratos]
      responses:
        '200':
          description: Lista de contratos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "cnt-001"
                    nombre:
                      type: string
                      example: "Contrato Lima-Arequipa"
                    fechaInicio:
                      type: string
                      format: date
                      example: "2026-01-15"
                    fechaFin:
                      type: string
                      format: date
                      example: "2026-12-31"
                    estado:
                      type: string
                      enum: [ACTIVO, VENCIDO, PENDIENTE]
                      example: ACTIVO
        '401':
          description: No autorizado
    post:
      summary: Crear contrato
      description: Registra un nuevo contrato de transporte.
      tags: [Contratos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, fechaInicio, fechaFin]
              properties:
                nombre:
                  type: string
                  example: "Contrato Lima-Cusco"
                fechaInicio:
                  type: string
                  format: date
                  example: "2026-06-01"
                fechaFin:
                  type: string
                  format: date
                  example: "2026-12-31"
      responses:
        '201':
          description: Contrato creado exitosamente
        '400':
          description: Datos inválidos