name: 🕷️ JOB 3 — DAST (ZAP + Nikto)

# ⚠️  SOLO MANUAL — ver SECURITY-WORKFLOWS-README.md

on:
  workflow_call:
    inputs:
      target_url:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL a escanear"
        required: true
        default: "https://testing.dcoqassfbrwx2.amplifyapp.com"
        type: string

jobs:
  dast-scan:
    name: "DAST — ZAP Spider AJAX + Nikto"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TARGET: ${{ inputs.target_url || github.event.inputs.target_url || 'https://testing.dcoqassfbrwx2.amplifyapp.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar URL accesible
        run: |
          echo "🎯 Objetivo: $TARGET"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$TARGET" || echo "000")
          echo "HTTP Status: $CODE"
          [ "$CODE" = "000" ] && echo "❌ URL no accesible" && exit 1 || echo "✅ URL accesible (HTTP $CODE)"

      - name: Crear directorio de reportes
        run: mkdir -p security-reports/dast/{zap,nikto}

      - name: Crear .zap/rules.tsv si no existe
        run: |
          mkdir -p .zap
          [ -f .zap/rules.tsv ] && echo "Ya existe" && exit 0
          cp .zap/rules.tsv .zap/rules.tsv 2>/dev/null || true

      - name: OWASP ZAP — Baseline Scan (AJAX Spider)
        uses: zaproxy/action-ajax-spider@v0
        with:
          target: ${{ env.TARGET }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"
        continue-on-error: true

      - name: Mover reportes ZAP
        run: |
          [ -f report_html.html ] && mv report_html.html security-reports/dast/zap/ || true
          [ -f report_json.json ] && mv report_json.json security-reports/dast/zap/ || true
          [ -f report_md.md ]    && mv report_md.md    security-reports/dast/zap/ || true

      - name: OWASP ZAP — Full Scan SPA
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ env.TARGET }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
          fail_action: false
          artifact_name: "zap-full-scan"
        continue-on-error: true

      - name: Instalar Nikto
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nikto

      - name: Nikto — Scan de servidor
        run: |
          HOST=$(echo "$TARGET" | sed 's|https://||;s|http://||;s|/.*||')
          PROTO=$(echo "$TARGET" | grep -o 'https\?' || echo "http")
          PORT=443; [ "$PROTO" = "http" ] && PORT=80

          nikto -h "$HOST" -p "$PORT" -ssl \
            -Format json \
            -output security-reports/dast/nikto/nikto-report.json \
            -Tuning 1234578 -timeout 10 -maxtime 5m || true

          nikto -h "$HOST" -p "$PORT" -ssl \
            -Format htm \
            -output security-reports/dast/nikto/nikto-report.html \
            -Tuning 1234578 -timeout 10 -maxtime 5m || true
        continue-on-error: true

      - name: Upload DAST artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-results
          path: security-reports/dast/
          retention-days: 30
