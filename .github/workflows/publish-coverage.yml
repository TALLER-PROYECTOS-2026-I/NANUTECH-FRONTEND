name: Publish Coverage to GitHub Pages

on:
  workflow_run:
    workflows: ["Tests & Coverage"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID (vacío = último exitoso)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Get run ID
        id: run
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/test-coverage.yml/runs?status=completed&per_page=1" \
              | jq -r '.workflow_runs[0].id // empty')
          else
            RUN_ID=${{ github.event.workflow_run.id }}
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "✅ Run ID: $RUN_ID"

      - name: Download coverage artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          mkdir -p all-coverage-reports

          ARTIFACT_ID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.name=="coverage-reports") | .id' | head -1)

          if [ -n "$ARTIFACT_ID" ] && [ "$ARTIFACT_ID" != "null" ]; then
            curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
              -o coverage-reports.zip
            unzip -qo coverage-reports.zip -d all-coverage-reports/
            rm coverage-reports.zip
            echo "✅ Coverage reports descargados"
            echo "--- Archivos descargados ---"
            ls -la all-coverage-reports/
          else
            echo "⚠️ Coverage reports no encontrados para run $RUN_ID"
            exit 1
          fi

      - name: Generate HTML report
        run: |
          mkdir -p docs/reports/latest/coverage

          cat > generate_report.py << 'PYEOF'
          import json
          import os
          from datetime import datetime

          CSS = """
          *{margin:0;padding:0;box-sizing:border-box}
          body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0e27;color:#e2e8f0;padding:24px}
          .container{max-width:1400px;margin:0 auto}
          h1{font-size:32px;margin-bottom:8px}
          .sub{color:#94a3b8;margin-bottom:24px;font-size:14px}
          .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
          .stat-card{background:#1e293b;border-radius:20px;padding:24px;text-align:center}
          .stat-number{font-size:42px;font-weight:800}
          .stat-label{font-size:13px;color:#64748b;margin-top:8px;text-transform:uppercase}
          table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:16px;overflow:hidden}
          th,td{padding:16px 20px;text-align:left;border-bottom:1px solid #334155}
          th{background:#0f172a;color:#94a3b8;font-size:13px;font-weight:600}
          tr:hover{background:#243044}
          .progress-bar{background:#334155;border-radius:12px;height:10px;width:140px;overflow:hidden}
          .progress-fill{height:100%;border-radius:12px}
          .good{background:#22c55e}
          .medium{background:#eab308}
          .bad{background:#ef4444}
          a{color:#60a5fa;text-decoration:none}
          .footer{margin-top:40px;padding:20px;text-align:center;color:#475569;border-top:1px solid #334155}
          .legend{display:flex;gap:24px;justify-content:center;margin:20px 0;padding:16px;background:#1e293b;border-radius:16px}
          .legend-color{width:20px;height:20px;border-radius:6px;display:inline-block;margin-right:8px}
          .table-container{overflow-x:auto}
          .badge-fail{background:#ef444420;color:#ef4444;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
          .badge-ok{background:#22c55e20;color:#22c55e;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
          """

          def get_color(pct):
              return "#22c55e" if pct >= 70 else "#eab308" if pct >= 50 else "#ef4444"

          def get_fill_class(pct):
              return "good" if pct >= 70 else "medium" if pct >= 50 else "bad"

          mfes = []
          for file in sorted(os.listdir("all-coverage-reports")):
              if file.endswith("-summary.json"):
                  mfe_name = file.replace("-summary.json", "")
                  with open(f"all-coverage-reports/{file}") as f:
                      data = json.load(f)
                  total = data.get("total", {})
                  mfes.append({
                      "name": mfe_name,
                      "lines": total.get("lines", {}).get("pct", 0),
                      "statements": total.get("statements", {}).get("pct", 0),
                      "branches": total.get("branches", {}).get("pct", 0),
                      "functions": total.get("functions", {}).get("pct", 0),
                      "full_data": data
                  })

          avg_lines = sum(m["lines"] for m in mfes) / len(mfes) if mfes else 0

          table_rows = ""
          for mfe in mfes:
              is_placeholder = mfe["lines"] == 0 and mfe["statements"] == 0
              estado = '<span class="badge-fail">sin datos</span>' if is_placeholder else '<span class="badge-ok">OK</span>'
              table_rows += f"""
              <tr>
                  <td style="font-weight:700"><a href="coverage/{mfe['name']}.html">{mfe['name']}</a></td>
                  <td style="color:{get_color(mfe['statements'])};font-weight:bold">{mfe['statements']:.1f}%</td>
                  <td style="color:{get_color(mfe['branches'])};font-weight:bold">{mfe['branches']:.1f}%</td>
                  <td style="color:{get_color(mfe['functions'])};font-weight:bold">{mfe['functions']:.1f}%</td>
                  <td style="color:{get_color(mfe['lines'])};font-weight:bold">{mfe['lines']:.1f}%</td>
                  <td><div class="progress-bar"><div class="progress-fill {get_fill_class(mfe['lines'])}" style="width:{mfe['lines']:.1f}%"></div></div></td>
                  <td>{estado}</td>
              </tr>"""

              files_rows = ""
              files_data = {k: v for k, v in mfe["full_data"].items() if k != "total"}

              for file_path, vals in sorted(files_data.items()):
                  file_name = file_path.split("/")[-1]
                  files_rows += f"""
                  <tr>
                      <td style="font-weight:500">{file_name}</td>
                      <td style="color:{get_color(vals.get('statements', {}).get('pct', 0))}">{vals.get('statements', {}).get('pct', 0):.1f}%</td>
                      <td style="color:{get_color(vals.get('branches', {}).get('pct', 0))}">{vals.get('branches', {}).get('pct', 0):.1f}%</td>
                      <td style="color:{get_color(vals.get('functions', {}).get('pct', 0))}">{vals.get('functions', {}).get('pct', 0):.1f}%</td>
                      <td style="color:{get_color(vals.get('lines', {}).get('pct', 0))}">{vals.get('lines', {}).get('pct', 0):.1f}%</td>
                      <td><div class="progress-bar"><div class="progress-fill {get_fill_class(vals.get('lines', {}).get('pct', 0))}" style="width:{vals.get('lines', {}).get('pct', 0):.1f}%"></div></div></td>
                  </tr>"""

              detail_html = f"""<!DOCTYPE html>
              <html>
              <head><meta charset="UTF-8"><title>{mfe['name']} - Cobertura</title>
              <style>{CSS}</style>
              </head>
              <body>
              <div class="container">
                  <a href="index.html" style="display:inline-block;margin-bottom:20px">← Volver al Dashboard</a>
                  <h1>📁 {mfe['name']}</h1>
                  <div class="sub">Detalle de cobertura por archivo</div>
                  <div class="legend">
                      <div><span class="legend-color" style="background:#22c55e"></span> ≥ 70% Excelente</div>
                      <div><span class="legend-color" style="background:#eab308"></span> 50%-69% Aceptable</div>
                      <div><span class="legend-color" style="background:#ef4444"></span> &lt;50% Necesita mejora</div>
                  </div>
                  <div class="table-container">
                  <table>
                      <thead><tr><th>Archivo</th><th>Sentencias</th><th>Ramas</th><th>Funciones</th><th>Líneas</th><th>Barra</th></tr></thead>
                      <tbody>{files_rows if files_rows else '<tr><td colspan="6" style="text-align:center;color:#64748b;padding:40px">⚠️ Tests fallaron — no hay datos de cobertura por archivo</td></tr>'}</tbody>
                  </table>
                  </div>
                  <div class="footer">Generado automáticamente por CI/CD Pipeline</div>
              </div>
              </body>
              </html>"""

              with open(f"docs/reports/latest/coverage/{mfe['name']}.html", "w") as f:
                  f.write(detail_html)

          main_html = f"""<!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><title>NANUTECH - Cobertura Microfrontends</title>
          <style>{CSS}</style>
          </head>
          <body>
          <div class="container">
              <h1>🚛 NANUTECH - Reporte de Cobertura</h1>
              <div class="sub">Microfrontends · Generado: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}</div>
              <div class="stats">
                  <div class="stat-card"><div class="stat-number" style="color:{get_color(avg_lines)}">{avg_lines:.1f}%</div><div class="stat-label">📊 Promedio General</div></div>
                  <div class="stat-card"><div class="stat-number">{len(mfes)}</div><div class="stat-label">📦 Microfrontends</div></div>
              </div>
              <div class="legend">
                  <div><span class="legend-color" style="background:#22c55e"></span> ≥ 70% Excelente</div>
                  <div><span class="legend-color" style="background:#eab308"></span> 50%-69% Aceptable</div>
                  <div><span class="legend-color" style="background:#ef4444"></span> &lt;50% Necesita mejora</div>
              </div>
              <h2 style="margin:30px 0 20px">📋 Microfrontends</h2>
              <div class="table-container">
              <table>
                  <thead><tr><th>Microfrontend</th><th>Sentencias</th><th>Ramas</th><th>Funciones</th><th>Líneas</th><th>Barra</th><th>Estado</th></tr></thead>
                  <tbody>{table_rows if table_rows else '<tr><td colspan="7">No hay datos disponibles</td></tr>'}</tbody>
              </table>
              </div>
              <div class="footer">
                  <p>💡 Haz clic en cualquier microfrontend para ver el detalle de sus archivos</p>
                  <p>Reporte generado automáticamente por CI/CD Pipeline</p>
              </div>
          </div>
          </body>
          </html>"""

          with open("docs/reports/latest/coverage/index.html", "w") as f:
              f.write(main_html)

          print("✅ Reportes HTML generados")
          PYEOF

          python3 generate_report.py

      - name: Generate main dashboard
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M:%S UTC')
          RUN_ID=${{ steps.run.outputs.run_id }}

          mkdir -p docs/reports/latest

          cat > docs/reports/latest/index.html << EOF
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <title>NANUTECH - Dashboard de Calidad</title>
              <style>
                  *{margin:0;padding:0;box-sizing:border-box}
                  body{background:#0a0e27;color:#e2e8f0;font-family:'Segoe UI',system-ui;padding:24px}
                  .container{max-width:1000px;margin:0 auto}
                  .header{background:linear-gradient(135deg,#0f172a,#1e3a8a);border-radius:24px;padding:40px;margin-bottom:30px}
                  .header h1{font-size:42px;margin-bottom:10px}
                  .card{background:#1e293b;border-radius:20px;padding:40px;text-align:center;cursor:pointer;transition:transform 0.2s;text-decoration:none;display:block}
                  .card:hover{transform:translateY(-4px);background:#243044}
                  .icon{font-size:64px;margin-bottom:16px}
                  .title{font-size:24px;font-weight:700;margin-bottom:8px;color:#e2e8f0}
                  .desc{font-size:14px;color:#94a3b8;margin-bottom:16px}
                  .badge{display:inline-block;background:#22c55e20;color:#22c55e;padding:8px 20px;border-radius:30px;font-weight:600}
                  .footer{margin-top:40px;padding:20px;text-align:center;color:#475569;border-top:1px solid #334155}
              </style>
          </head>
          <body>
          <div class="container">
              <div class="header">
                  <h1>🚛 NANUTECH FRONTEND</h1>
                  <p>Dashboard de Calidad de Software · $DATE</p>
              </div>
              <a href="coverage/index.html" class="card">
                  <div class="icon">📈</div>
                  <div class="title">Cobertura de Código</div>
                  <div class="desc">Reporte interactivo de cobertura por microfrontend.</div>
                  <span class="badge">Ver reporte →</span>
              </a>
              <div class="footer">CI/CD Pipeline · Run ID: $RUN_ID</div>
          </div>
          </body>
          </html>
          EOF

          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html><head><meta http-equiv="refresh" content="0; url=reports/latest/index.html"></head>
          <body>Redirigiendo...</body>
          </html>
          EOF

          echo "✅ Dashboard generado"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Publish coverage report to GitHub Pages"

      - name: Print URL
        run: |
          echo "=========================================="
          echo "✅ Reporte publicado!"
          echo "📊 Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "📈 Cobertura: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/latest/coverage/"
          echo "=========================================="
