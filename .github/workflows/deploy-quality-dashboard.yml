name: Deploy Quality Dashboard

on:
  push:
    branches:
      - feature/quality-dashboard
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Prism
        run: npm install -g @stoplight/prism-cli

      - name: Levantar Prism en background
        run: nohup prism mock swagger.yaml &

      - name: Esperar que Prism levante
        run: sleep 5

      - name: OWASP ZAP API Scan → generar reporte HTML
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://127.0.0.1:4010'
          format: openapi
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-I'
          report_html: zap-report.html

      - name: Mover reporte ZAP a docs
        run: |
          mkdir -p docs/reports/zap
          cp zap-report.html docs/reports/zap/report.html

      - name: Generar Swagger UI estático
        run: |
          mkdir -p docs/reports/swagger
          cat > docs/reports/swagger/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>NANUTECH API Docs</title>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
          </head>
          <body>
          <div id="swagger-ui"></div>
          <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
          <script>
            SwaggerUIBundle({
              url: "../../swagger.yaml",
              dom_id: '#swagger-ui',
              presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
              layout: "BaseLayout"
            })
          </script>
          </body>
          </html>
          EOF

      - name: Copiar swagger.yaml a docs
        run: cp swagger.yaml docs/swagger.yaml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4