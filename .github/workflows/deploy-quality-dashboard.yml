name: Deploy Quality Dashboard

on:
  push:
    branches:
      - feature/quality-dashboard
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests con cobertura
        run: npm run test:coverage:all || true

      - name: Verificar URL frontend accesible
        run: |
          TARGET="https://testing.dcoqassfbrwx2.amplifyapp.com"
          echo "Objetivo: $TARGET"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$TARGET" || echo "000")
          echo "HTTP Status: $CODE"
          if [ "$CODE" = "000" ]; then
            echo "URL no accesible"
          else
            echo "URL accesible HTTP $CODE"
          fi

      - name: OWASP ZAP Full Scan Frontend
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'https://testing.dcoqassfbrwx2.amplifyapp.com'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -I'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-frontend-scan
        continue-on-error: true

      - name: Preparar reporte ZAP
        if: always()
        env:
          WORKSPACE: /home/runner/work/NANUTECH-FRONTEND/NANUTECH-FRONTEND
        run: |
          mkdir -p docs/reports/zap
          python3 .github/scripts/zap_report.py

      - name: Generar Swagger UI
        run: |
          mkdir -p docs/reports/swagger
          cp swagger.yaml docs/swagger.yaml
          echo '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"><title>NANUTECH API Docs</title><link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0d1117;font-family:Segoe UI,sans-serif;color:#e6edf3}header{background:#161b22;border-bottom:1px solid #30363d;padding:24px 40px;display:flex;align-items:center;justify-content:space-between}header h1{color:#58a6ff;font-size:1.5rem}header p{color:#8b949e;font-size:.85rem;margin-top:4px}.badges{display:flex;gap:8px}.badge{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600}.b-blue{background:#1f3a5f;color:#58a6ff}.b-green{background:#1a3a2a;color:#3fb950}.b-orange{background:#3a2a1a;color:#f0883e}#wrap{max-width:1100px;margin:32px auto;padding:0 24px 60px}.swagger-ui .topbar{display:none!important}.swagger-ui .info{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:24px;margin-bottom:24px}.swagger-ui .info .title{color:#f0f6fc;font-size:1.3rem}.swagger-ui .info p,.swagger-ui .info a{color:#8b949e}.swagger-ui .scheme-container{background:#161b22;border-bottom:1px solid #30363d;padding:12px 0}.swagger-ui select{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px}.swagger-ui .opblock-tag{color:#e6edf3;border-bottom:1px solid #21262d;font-size:1rem;padding:12px 0}.swagger-ui .opblock-tag small{color:#8b949e}.swagger-ui .opblock{border-radius:8px;margin-bottom:8px;border:none}.swagger-ui .opblock.opblock-get{background:#0d1f2d;border:1px solid #1f3a5f}.swagger-ui .opblock.opblock-post{background:#0d2318;border:1px solid #1a3a2a}.swagger-ui .opblock.opblock-delete{background:#2d0d0d;border:1px solid #5f1f1f}.swagger-ui .opblock-summary-method{border-radius:6px;font-weight:700;min-width:80px;text-align:center}.swagger-ui .opblock-summary-description{color:#8b949e}.swagger-ui .opblock-body{background:#161b22}.swagger-ui .opblock-section-header{background:#1c2128;border-bottom:1px solid #30363d}.swagger-ui .opblock-section-header label{color:#e6edf3}.swagger-ui table thead tr td,.swagger-ui table thead tr th{color:#8b949e;border-bottom:1px solid #30363d}.swagger-ui .response-col_status{color:#3fb950}.swagger-ui .response-col_description{color:#e6edf3}.swagger-ui .model-box{background:#161b22;border:1px solid #30363d;border-radius:6px}.swagger-ui .model{color:#e6edf3}.swagger-ui .prop-type{color:#58a6ff}.swagger-ui .prop-format{color:#8b949e}.swagger-ui input[type=text],.swagger-ui textarea{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px}.swagger-ui .btn{border-radius:6px;font-weight:600}.swagger-ui .btn.execute{background:#238636;border-color:#238636;color:#fff}.swagger-ui .btn.cancel{background:#21262d;border-color:#30363d;color:#e6edf3}.swagger-ui .highlight-code{background:#161b22}.swagger-ui .microlight{background:#161b22;color:#e6edf3;border-radius:6px;padding:12px}</style></head><body><header><div><h1>NANUTECH Frontend API</h1><p>Documentacion OpenAPI · Backend AWS API Gateway · JWT Auth</p></div><div class="badges"><span class="badge b-blue">OAS 3.0</span><span class="badge b-green">Spectral</span><span class="badge b-orange">AWS Real</span></div></header><div id="wrap"><div id="swagger-ui"></div></div><script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script><script>SwaggerUIBundle({url:"../../swagger.yaml",dom_id:"#swagger-ui",presets:[SwaggerUIBundle.presets.apis,SwaggerUIBundle.SwaggerUIStandalonePreset],layout:"BaseLayout",deepLinking:true})</script></body></html>' > docs/reports/swagger/index.html

      - name: Generar reporte de cobertura
        if: always()
        run: |
          mkdir -p docs/reports/coverage
          for MFE in mfe-contratos mfe-dashboard mfe-flota shell-app; do
            mkdir -p docs/reports/coverage/$MFE
            SUMMARY="apps/$MFE/coverage/coverage-summary.json"
            if [ -f "$SUMMARY" ]; then
              cp "$SUMMARY" docs/reports/coverage/$MFE/coverage-summary.json
              echo "OK $MFE coverage copiado"
            else
              echo "WARN $MFE sin datos"
              echo '{"total":{"statements":{"pct":0},"branches":{"pct":0},"functions":{"pct":0},"lines":{"pct":0}}}' > docs/reports/coverage/$MFE/coverage-summary.json
            fi
          done
          echo '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Coverage - NANUTECH</title><style>body{background:#0d1117;color:#e6edf3;font-family:sans-serif;padding:40px 20px}h1{color:#58a6ff;text-align:center;margin-bottom:8px}p.sub{text-align:center;color:#8b949e;margin-bottom:40px}table{width:100%;max-width:900px;margin:0 auto;border-collapse:collapse}th{background:#161b22;padding:12px 16px;text-align:left;color:#8b949e;font-size:.85rem;border-bottom:1px solid #30363d}td{padding:12px 16px;border-bottom:1px solid #21262d;font-size:.9rem}.bar{background:#21262d;border-radius:4px;height:8px;width:100%;margin-top:4px}.fill{height:8px;border-radius:4px}.green{background:#3fb950}.yellow{background:#d29922}.red{background:#f85149}.pct{font-weight:600}</style></head><body><h1>Test Coverage</h1><p class="sub">Cobertura por microfrontend - generado por CI/CD</p><table><thead><tr><th>MFE</th><th>Statements</th><th>Branches</th><th>Functions</th><th>Lines</th></tr></thead><tbody id="tbody"></tbody></table><script>const mfes=["mfe-contratos","mfe-dashboard","mfe-flota","shell-app"];const tbody=document.getElementById("tbody");const color=p=>p>=80?"green":p>=50?"yellow":"red";const bar=p=>`<div class="bar"><div class="fill ${color(p)}" style="width:${Math.min(p,100)}%"></div></div>`;const cell=p=>`<td><span class="pct">${p}%</span>${bar(p)}</td>`;Promise.all(mfes.map(m=>fetch(m+"/coverage-summary.json").then(r=>r.json()).catch(()=>null))).then(results=>{results.forEach((data,i)=>{const tr=document.createElement("tr");if(!data){tr.innerHTML=`<td>${mfes[i]}</td><td colspan="4" style="color:#8b949e">Sin datos</td>`;}else{const t=data.total;tr.innerHTML=`<td><strong>${mfes[i]}</strong></td>${cell(t.statements.pct)}${cell(t.branches.pct)}${cell(t.functions.pct)}${cell(t.lines.pct)}`;}tbody.appendChild(tr);});});</script></body></html>' > docs/reports/coverage/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4