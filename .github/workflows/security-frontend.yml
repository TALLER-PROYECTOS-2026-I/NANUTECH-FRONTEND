name: Security Frontend

on:
  workflow_dispatch:
    inputs:
      run_sast:
        description: "JOB 1 - SAST (Semgrep + ESLint + Gitleaks)"
        type: boolean
        default: true
      run_deps:
        description: "JOB 2 - Dependencies (npm audit + OWASP + Retire.js)"
        type: boolean
        default: true
      run_dast:
        description: "JOB 3 - DAST (ZAP + Nikto) - requiere Amplify activo"
        type: boolean
        default: false
      run_browser:
        description: "JOB 4 - Browser Analysis (Playwright) - requiere Amplify activo"
        type: boolean
        default: false
      run_headers:
        description: "JOB 5 - Headers Scan (Observatory + curl) - requiere Amplify activo"
        type: boolean
        default: false
      run_report:
        description: "JOB 6 - Publicar reporte en GitHub Pages"
        type: boolean
        default: true
      target_url:
        description: "URL de Amplify a escanear"
        type: string
        default: "https://testing.dcoqassfbrwx2.amplifyapp.com"

  pull_request:
    branches: [develop, main]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.json"
      - "*.js"
      - "*.ts"

  push:
    branches:
      - testing

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-scan:
    name: "JOB 1 - SAST"
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_sast == 'true')
    uses: ./.github/workflows/job1-sast.yml
    secrets: inherit

  dependency-scan:
    name: "JOB 2 - Dependencies"
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_deps == 'true')
    uses: ./.github/workflows/job2-dependencies.yml
    secrets: inherit

  dynamic-scan:
    name: "JOB 3 - DAST"
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_dast == 'true'
    uses: ./.github/workflows/job3-dast.yml
    with:
      target_url: ${{ github.event.inputs.target_url || 'https://testing.dcoqassfbrwx2.amplifyapp.com' }}
    secrets: inherit

  browser-analysis:
    name: "JOB 4 - Browser Analysis"
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_browser == 'true'
    uses: ./.github/workflows/job4-browser.yml
    with:
      target_url: ${{ github.event.inputs.target_url || 'https://testing.dcoqassfbrwx2.amplifyapp.com' }}
    secrets: inherit

  headers-scan:
    name: "JOB 5 - Headers"
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_headers == 'true'
    uses: ./.github/workflows/job5-headers.yml
    with:
      target_url: ${{ github.event.inputs.target_url || 'https://testing.dcoqassfbrwx2.amplifyapp.com' }}
    secrets: inherit

  publish-report:
    name: "JOB 6 - Publish Report"
    needs: [sast-scan, dependency-scan, dynamic-scan, browser-analysis, headers-scan]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_report == 'true'
    uses: ./.github/workflows/job6-report.yml
    secrets: inherit

  frontend-security:
    name: "Frontend Security Scan"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for Amplify deployment
        run: sleep 90

      - name: Verify frontend availability
        run: curl -I https://testing.dcoqassfbrwx2.amplifyapp.com

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: "https://testing.dcoqassfbrwx2.amplifyapp.com"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-frontend-report

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
