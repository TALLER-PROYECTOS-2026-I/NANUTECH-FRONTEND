name: 🛡️ Security Frontend — Orquestador

# --- AÑADE ESTO AQUÍ ---
permissions:
  contents: read
  security-events: write
  actions: read
# -----------------------

on:
  workflow_dispatch:
    inputs:
      run_sast:
        description: "JOB 1 — SAST (Semgrep + ESLint + Gitleaks)"
        type: boolean
        default: true
      run_deps:
        description: "JOB 2 — Dependencies (npm audit + OWASP + Retire.js)"
        type: boolean
        default: true
      run_dast:
        description: "JOB 3 — DAST (ZAP + Nikto)"
        type: boolean
        default: false
      run_browser:
        description: "JOB 4 — Browser Analysis (Playwright)"
        type: boolean
        default: false
      run_headers:
        description: "JOB 5 — Headers Scan"
        type: boolean
        default: false
      run_nuclei:
        description: "JOB 7 — Nuclei Scan (Rápido y moderno)"
        type: boolean
        default: false
      run_report:
        description: "JOB 6 — Publicar reporte en GitHub Pages"
        type: boolean
        default: true
      target_url:
        description: "URL de Amplify a escanear"
        type: string
        default: "https://testing.dcoqassfbrwx2.amplifyapp.com"

  pull_request:
    branches: [develop, main]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.json"
      - "*.js"
      - "*.ts"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-scan:
    name: "🔍 JOB 1 — SAST"
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_sast == 'true')
    uses: ./.github/workflows/job1-sast.yml
    secrets: inherit

  dependency-scan:
    name: "📦 JOB 2 — Dependencies"
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_deps == 'true')
    uses: ./.github/workflows/job2-dependencies.yml
    secrets: inherit

  dynamic-scan:
    name: "🕷️ JOB 3 — DAST"
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_dast == 'true'
    uses: ./.github/workflows/job3-dast.yml
    with:
      target_url: ${{ github.event.inputs.target_url || 'https://testing.dcoqassfbrwx2.amplifyapp.com' }}
    secrets: inherit

  browser-analysis:
    name: "🌐 JOB 4 — Browser Analysis"
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_browser == 'true'
    uses: ./.github/workflows/job4-browser.yml
    with:
      target_url: ${{ github.event.inputs.target_url || 'https://testing.dcoqassfbrwx2.amplifyapp.com' }}
    secrets: inherit

  headers-scan:
    name: "🔒 JOB 5 — Headers"
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_headers == 'true'
    uses: ./.github/workflows/job5-headers.yml
    with:
      target_url: ${{ github.event.inputs.target_url || 'https://testing.dcoqassfbrwx2.amplifyapp.com' }}
    secrets: inherit

  nuclei-scan:
    name: "🚀 JOB 7 — Nuclei"
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_nuclei == 'true'
    uses: ./.github/workflows/job7-nuclei.yml
    with:
      target_url: ${{ github.event.inputs.target_url || 'https://testing.dcoqassfbrwx2.amplifyapp.com' }}
    secrets: inherit

  publish-report:
    name: "📊 JOB 6 — Publish Report"
    needs:
      [
        sast-scan,
        dependency-scan,
        dynamic-scan,
        browser-analysis,
        headers-scan,
        nuclei-scan,
      ]
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.run_report == 'true'
    uses: ./.github/workflows/job6-report.yml
    secrets: inherit
