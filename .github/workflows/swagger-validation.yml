name: Swagger Validation (Spectral)

on:
  push:
    branches:
      - feature/quality-dashboard
  pull_request:
    branches:
      - dev
      - main

jobs:
  spectral-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Crear ruleset Spectral
        run: |
          echo 'extends: ["spectral:oas"]' > .spectral.yaml

      - name: Ejecutar Spectral lint
        run: spectral lint swagger.yaml --ruleset .spectral.yaml