name: Tests & Coverage

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: 🧪 Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage for all workspaces
        id: tests
        run: |
          # Ejecutar coverage en todos los workspaces
          npm run test:coverage:all 2>&1 | tee coverage-output.log || true

          # Verificar si todos los tests pasaron
          if grep -q "failed" coverage-output.log; then
            echo "tests_passed=false" >> $GITHUB_OUTPUT
          else
            echo "tests_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Collect coverage reports from all MFEs
        run: |
          mkdir -p all-coverage-reports

          # Recolectar coverage de cada MFE
          for mfe in mfe-flota mfe-contratos mfe-dashboard shell-app; do
            if [ -f "apps/$mfe/coverage/coverage-summary.json" ]; then
              echo "✅ Coverage encontrado para $mfe"
              cp "apps/$mfe/coverage/coverage-summary.json" "all-coverage-reports/$mfe-summary.json"
              cp -r "apps/$mfe/coverage" "all-coverage-reports/$mfe-coverage/" 2>/dev/null || true
            else
              echo "⚠️ No coverage para $mfe"
            fi
          done

          # Recolectar coverage de packages
          for pkg in utils api-client ui-components; do
            if [ -f "packages/$pkg/coverage/coverage-summary.json" ]; then
              echo "✅ Coverage encontrado para @nanutech/$pkg"
              cp "packages/$pkg/coverage/coverage-summary.json" "all-coverage-reports/pkg-$pkg-summary.json"
            fi
          done

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: all-coverage-reports/
          retention-days: 30

      - name: Check coverage thresholds
        run: |
          THRESHOLD=50
          FAILED=false

          for summary in all-coverage-reports/*-summary.json; do
            if [ -f "$summary" ]; then
              COVERAGE=$(jq '.total.lines.pct // 0' "$summary")
              MFE=$(basename "$summary" -summary.json)
              
              echo "📊 $MFE: ${COVERAGE}% coverage"
              
              if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
                echo "❌ $MFE coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
                FAILED=true
              else
                echo "✅ $MFE coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
              fi
            fi
          done

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
